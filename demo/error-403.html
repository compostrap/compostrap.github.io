<!DOCTYPE html>
<!-- generated by scripts/build-demo.js from demo/ — edit demo/_layout-error.html and demo/pages/, not this file -->
<html lang="en" data-bs-theme="light">

<head>
	<meta charset="UTF-8">
	<!-- the stored theme (without one the theme of the system) before the page is drawn, so a dark page does not flash light -->
	<script>
		try {
			let theme = localStorage.getItem('bootstrap-theme') || 'auto';
			if (theme === 'auto') {
				theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			if (theme === 'light' || theme === 'dark') {
				document.documentElement.setAttribute('data-bs-theme', theme);
			}
		} catch (e) { }
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- the text size set in the system (a phone) scales the page: the sizes are in rem and the root size is not set -->
	<meta name="text-scale" content="scale">
	<link rel="icon" href="./assets/favicon-CmwL7Drz.svg" type="image/svg+xml">
	<title>Access denied (403) – Compostrap</title>
	<meta name="description" content="Access denied (403) – a demo page of Compostrap, the Bootstrap 5.3 theme with modules for administrations and websites.">
  <link rel="stylesheet" crossorigin href="./assets/compostrap-Cbd5tBiI.css">
</head>

<body>
