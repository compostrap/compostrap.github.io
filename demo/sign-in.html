<!DOCTYPE html>
<!-- generated by scripts/build-demo.js from demo/ — edit demo/_layout-auth.html and demo/pages/, not this file -->
<html lang="en" data-bs-theme="light">

<head>
	<meta charset="UTF-8">
	<!-- the stored theme (without one the theme of the system) before the page is drawn, so a dark page does not flash light -->
	<script>
		try {
			let theme = localStorage.getItem('bootstrap-theme') || 'auto';
			if (theme === 'auto') {
				theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
			}
			if (theme === 'light' || theme === 'dark') {
				document.documentElement.setAttribute('data-bs-theme', theme);
			}
		} catch (e) { }
	</script>
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<!-- the text size set in the system (a phone) scales the page: the sizes are in rem and the root size is not set -->
	<meta name="text-scale" content="scale">
	<link rel="icon" href="./assets/favicon-CmwL7Drz.svg" type="image/svg+xml">
	<title>Sign in – Compostrap</title>
	<meta name="description" content="Sign in – a demo page of Compostrap, the Bootstrap 5.3 theme with modules for administrations and websites.">
  <script type="module" crossorigin src="./assets/sign-in-BcLXr9R2.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/tooltip-CgEQ6vyQ.js">
  <link rel="modulepreload" crossorigin href="./assets/otp-input-DEQOt9_-.js">
  <link rel="stylesheet" crossorigin href="./assets/compostrap-BtGXclRp.css">
</head>

<body class="auth-page">

<div class="auth">
	<div class="auth-top">
		<!-- the brand leads back to the demo -->
		<a class="auth-brand" href="index.html">
			<svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true">
				<circle cx="14" cy="14" r="14" fill="#ff4141"/>
				<path d="M18.02 10.63A5.25 5.25 0 1 0 18.02 17.37" fill="none" stroke="#fff" stroke-width="1.3"/>
			</svg>
			<span>Compostrap</span>
		</a>

		<div class="auth-actions">
			<button type="button" class="navbar-icon" aria-label="Toggle theme" data-tooltip="left" data-theme-switcher data-theme-light-icon="bi bi-sun" data-theme-dark-icon="bi bi-moon">
				<i data-theme-switcher-icon class="bi bi-moon" aria-hidden="true"></i>
			</button>

			<!-- language: an icon with the code of the current language, the languages in the dropdown, the current one checked -->
			<div class="dropdown">
				<button type="button" class="navbar-icon" data-bs-toggle="dropdown" aria-expanded="false">
					<i class="bi bi-translate" aria-hidden="true"></i><span class="visually-hidden">Language: </span><span class="navbar-icon-text">EN</span>
				</button>
				<ul class="dropdown-menu dropdown-menu-end">
					<li><h6 class="dropdown-header">Language</h6></li>
					<li><a class="dropdown-item d-flex align-items-center gap-3" href="#" lang="cs"><span class="me-auto">Čeština</span><span class="small text-body-secondary">CS</span><i class="bi bi-check-lg invisible" aria-hidden="true"></i></a></li>
					<li><a class="dropdown-item active d-flex align-items-center gap-3" href="#" lang="en" aria-current="true"><span class="me-auto">English</span><span class="small text-body-secondary">EN</span><i class="bi bi-check-lg" aria-hidden="true"></i></a></li>
				</ul>
			</div>
		</div>
	</div>

	<!-- the sign-in page of drago (project-auth): a visual on the left, the form on the right; without `auth-card-split`
		the box is narrow and has no visual -->
	<div class="auth-card auth-card-split">
		<aside class="auth-visual" aria-hidden="true">
			<i class="bi bi-shield-lock"></i>
		</aside>

		<main class="auth-body">
			<header class="auth-header">
				<h1 class="auth-title">Sign in to your account</h1>
				<p class="auth-subtitle">Enter your email and password to continue.</p>
			</header>

			<form class="row g-3" onsubmit="return false">
				<div class="col-12">
					<label for="sign-email" class="form-label">E-mail</label>
					<input type="email" class="form-control" id="sign-email" autocomplete="username" required placeholder="jan@example.com">
				</div>
				<div class="col-12">
					<label for="sign-password" class="form-label">Password</label>
					<div class="password-toggle">
						<input type="password" class="form-control" id="sign-password" autocomplete="current-password" required>
						<button type="button" class="password-toggle-btn" data-password-toggle aria-label="Show password" aria-pressed="false"></button>
					</div>
				</div>
				<div class="col-12 d-grid">
					<button type="submit" class="btn btn-primary">Sign in</button>
				</div>
			</form>

			<div class="auth-links">
				<a href="sign-up.html">Create account</a>
				<a href="recovery.html">Forgot your password?</a>
			</div>
		</main>
	</div>

	<footer class="auth-footer">&copy; 2026 Compostrap</footer>
</div>



<script src="lib/bootstrap.bundle.min.js" defer></script>

</body>
</html>
